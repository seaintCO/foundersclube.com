<body class="bg-black text-primary overflow-x-hidden selection:bg-primary selection:text-black">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { motion, useInView, useScroll, useTransform, AnimatePresence } = window.Motion;

        // --- COMPONENTS ---

        const WordsPullUp = ({ text, showAsterisk }) => {
            const ref = useRef(null);
            const isInView = useInView(ref, { once: true, margin: "0px 0px -10% 0px" });
            const words = text.split(' ');

            return (
                <div ref={ref} className="flex">
                    {words.map((word, i) => (
                        <motion.span
                            key={i}
                            initial={{ y: 20, opacity: 0 }}
                            animate={isInView ? { y: 0, opacity: 1 } : {}}
                            transition={{ delay: i * 0.08, ease: [0.16, 1, 0.3, 1], duration: 0.8 }}
                            className="inline-block relative"
                        >
                            {word}
                            {showAsterisk && i === words.length - 1 && (
                                <span className="absolute top-[0.65em] -right-[0.3em] text-[0.31em] font-light leading-none">*</span>
                            )}
                        </motion.span>
                    ))}
                </div>
            );
        };

        const WordsPullUpMultiStyle = ({ segments, className = "" }) => {
            const ref = useRef(null);
            const isInView = useInView(ref, { once: true, margin: "0px 0px -10% 0px" });
            
            const words = [];
            segments.forEach(seg => {
                const splitWords = seg.text.split(' ');
                splitWords.forEach((w, idx) => {
                    if (w) words.push({ text: w, className: seg.className, space: idx < splitWords.length - 1 });
                });
            });

            return (
                <div ref={ref} className={`inline-flex flex-wrap justify-center gap-x-[0.25em] ${className}`}>
                    {words.map((wordObj, i) => (
                        <div key={i} className="overflow-hidden pb-[0.1em]">
                            <motion.span
                                initial={{ y: 20, opacity: 0 }}
                                animate={isInView ? { y: 0, opacity: 1 } : {}}
                                transition={{ delay: i * 0.08, ease: [0.16, 1, 0.3, 1], duration: 0.8 }}
                                className={`inline-block ${wordObj.className}`}
                            >
                                {wordObj.text}
                            </motion.span>
                        </div>
                    ))}
                </div>
            );
        };

        const ScrollTextReveal = ({ text }) => {
            const containerRef = useRef(null);
            const { scrollYProgress } = useScroll({
                target: containerRef,
                offset: ['start 0.8', 'end 0.2']
            });

            const chars = text.split('');

            return (
                <p ref={containerRef} className="text-[#DEDBC8] text-[11px] sm:text-xs md:text-sm leading-[1.9] max-w-xl mx-auto font-light tracking-[0.01em]">
                    {chars.map((char, i) => {
                        const start = i / chars.length - 0.1;
                        const end = i / chars.length + 0.05;
                        const opacity = useTransform(scrollYProgress, [start, end], [0.2, 1]);
                        
                        return (
                            <motion.span key={i} style={{ opacity }}>
                                {char}
                            </motion.span>
                        );
                    })}
                </p>
            );
        };

        const FeatureCard = ({ children, index, className = "" }) => {
            const ref = useRef(null);
            const isInView = useInView(ref, { once: true, margin: "0px 0px -100px 0px" });

            return (
                <motion.div
                    ref={ref}
                    initial={{ scale: 0.95, opacity: 0 }}
                    animate={isInView ? { scale: 1, opacity: 1 } : {}}
                    transition={{ delay: index * 0.15, duration: 0.7, ease: [0.22, 1, 0.36, 1] }}
                    className={`rounded-2xl overflow-hidden ${className}`}
                >
                    {children}
                </motion.div>

                                            <WordsPullUp text="Founders Clube" showAsterisk={true} />
                                        </div>
                                    </div>
                                </div>

                                {/* Right: Description & CTA */}
                                <div className="hero-copy col-span-12 md:col-span-5 flex flex-col items-start md:items-start justify-end md:pb-[1vw] gap-5 md:gap-6 order-1 md:order-1">
                                    <motion.p 
                                        initial={{ y: 20, opacity: 0 }}
                                        animate={{ y: 0, opacity: 1 }}
                                        transition={{ delay: 0.5, duration: 0.8, ease: [0.16, 1, 0.3, 1] }}
                                        className="text-primary/65 text-[9px] sm:text-[10px] md:text-xs leading-[1.7] md:text-left max-w-[250px] font-light tracking-[0.015em]"
                                    >
                                        Where creativity starts. A private club for founders, builders and visionaries creating what comes next.
                                    </motion.p>

                                    <motion.button
                                        initial={{ y: 20, opacity: 0 }}

                                        transition={{ delay: 0.7, duration: 0.8, ease: [0.16, 1, 0.3, 1] }}

                                    >
                                        <span>Apply Now</span>
                                        <div className="bg-black rounded-full w-7 h-7 sm:w-8 sm:h-8 flex items-center justify-center transform group-hover:scale-110 transition-transform duration-300">
                                            <iconify-icon icon="solar:arrow-right-linear" style={{ color: '#DEDBC8' }} width="20" stroke-width="1.5"></iconify-icon>
                                        </div>
                                    </motion.button>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        const About = () => {
            const headingSegments = [
                { text: "Built for founders", className: "font-normal" },
                { text: "who refuse to build alone.", className: "font-serif italic pr-1" },
                { text: "A private room for ambitious operators, creators, investors, and business leaders.", className: "font-normal" }
            ];

            return (
                <section className="bg-black py-28 md:py-44 px-4 md:px-6">
                    <div className="bg-[#101010] rounded-[2rem] max-w-6xl mx-auto p-10 md:p-16 lg:p-24 flex flex-col items-center text-center shadow-2xl">
                        
                        <span className="text-primary text-[10px] sm:text-xs tracking-widest uppercase mb-10 md:mb-16 font-semibold opacity-70">
                            Private Membership
                        </span>

                        <div className="text-2xl sm:text-3xl md:text-4xl lg:text-5xl xl:text-[3.6rem] max-w-4xl mx-auto leading-[1.18] tracking-[-0.02em] mb-14 md:mb-24" style={{ color: '#E1E0CC' }}>
                            <WordsPullUpMultiStyle segments={headingSegments} />
                        </div>

                        <div className="w-full max-w-2xl mx-auto">
                            <ScrollTextReveal text="Founders Club exists to put serious builders in the same room. No surface-level networking. No endless pitch decks. Just curated conversations, trusted relationships, private sessions, and access to people who understand what it takes to build." />
                        </div>

                    </div>
                </section>

        };

        const Features = () => {
            const headerSegments = [
                { text: "A private ecosystem for serious founders.", className: "text-[#E1E0CC]" },
                { text: "Curated people. Real conversations. Better opportunities.", className: "text-gray-500 mt-2 block w-full text-center" }
            ];

            return (
                <section className="min-h-screen bg-black relative py-24 md:py-32 px-4 md:px-6 overflow-hidden">
                    <div className="absolute inset-0 bg-noise opacity-[0.15] pointer-events-none"></div>
                    
                    <div className="relative z-10 max-w-[1400px] mx-auto">
                        
                        <div className="text-lg sm:text-xl md:text-2xl lg:text-3xl font-normal tracking-[-0.02em] leading-[1.35] mb-20 md:mb-28 text-center">
                            <WordsPullUpMultiStyle segments={headerSegments} className="flex-col !gap-y-2" />
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-2 md:gap-1 lg:h-[480px]">
                            
                            {/* Card 1: Video */}
                            <FeatureCard index={0} className="relative h-[300px] md:h-[400px] lg:h-full group cursor-pointer">
                                <video 
                                    src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260406_133058_0504132a-0cf3-4450-a370-8ea3b05c95d4.mp4"
                                    autoPlay loop muted playsInline
                                    className="absolute inset-0 w-full h-full object-cover transition-transform duration-700 group-hover:scale-105"
                                />
                                <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent"></div>
                                <div className="absolute bottom-6 left-6 text-[#E1E0CC] font-medium tracking-tight text-sm sm:text-base">
                                    Build in better rooms.
                                </div>
                            </FeatureCard>

                            {/* Card 2 */}
                            <FeatureCard index={1} className="bg-[#212121] p-7 sm:p-9 flex flex-col h-[350px] lg:h-full">
                                <img src="https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260405_171918_4a5edc79-d78f-4637-ac8b-53c43c220606.png&w=1280&q=85" alt="Icon" className="w-10 h-10 sm:w-12 sm:h-12 rounded-lg mb-8 object-cover opacity-90" />
                                <div className="flex items-baseline gap-3 mb-6">
                                    <h3 className="text-[#E1E0CC] font-medium tracking-tight text-base sm:text-lg">Founder Sessions.</h3>
                                    <span className="text-gray-500 text-xs font-serif italic">01</span>
                                </div>
                                <ul className="space-y-4 flex-1">
                                    {["Private founder roundtables", "Operator-led conversations", "Business breakdowns", "Tactical problem solving"].map((item, i) => (
                                        <li key={i} className="flex items-start gap-3 text-[11px] sm:text-xs text-gray-400 font-light leading-relaxed">

                                            {item}
                                        </li>
                                    ))}
                                </ul>
                                <a href="#" className="inline-flex items-center gap-2 text-primary text-xs sm:text-sm font-medium mt-6 group w-fit">
                                    Explore
                                    <iconify-icon icon="solar:arrow-right-linear" class="transform -rotate-45 group-hover:translate-x-1 group-hover:-translate-y-1 transition-transform" width="16" stroke-width="1.5"></iconify-icon>
                                </a>
                            </FeatureCard>

                            {/* Card 3 */}
                            <FeatureCard index={2} className="bg-[#212121] p-7 sm:p-9 flex flex-col h-[350px] lg:h-full">
                                <img src="https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260405_171741_ed9845ab-f5b2-4018-8ce7-07cc01823522.png&w=1280&q=85" alt="Icon" className="w-10 h-10 sm:w-12 sm:h-12 rounded-lg mb-8 object-cover opacity-90" />
                                <div className="flex items-baseline gap-3 mb-6">
                                    <h3 className="text-[#E1E0CC] font-medium tracking-tight text-base sm:text-lg">Capital & Dealflow.</h3>
                                    <span className="text-gray-500 text-xs font-serif italic">02</span>
                                </div>
                                <ul className="space-y-4 flex-1">
                                    {["Investor introductions", "Private opportunities", "Founder-to-founder referrals", "Strategic partnerships"].map((item, i) => (
                                        <li key={i} className="flex items-start gap-3 text-[11px] sm:text-xs text-gray-400 font-light leading-relaxed">
                                            <iconify-icon icon="solar:check-circle-linear" class="text-primary mt-0.5" width="16" stroke-width="1.5"></iconify-icon>
                                            {item}
                                        </li>
                                    ))}
                                </ul>
                                <a href="#" className="inline-flex items-center gap-2 text-primary text-xs sm:text-sm font-medium mt-6 group w-fit">
                                    Explore
                                    <iconify-icon icon="solar:arrow-right-linear" class="transform -rotate-45 group-hover:translate-x-1 group-hover:-translate-y-1 transition-transform" width="16" stroke-width="1.5"></iconify-icon>
                                </a>
                            </FeatureCard>

                            {/* Card 4 */}
                            <FeatureCard index={3} className="bg-[#212121] p-7 sm:p-9 flex flex-col h-[350px] lg:h-full">
                                <img src="https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260405_171809_f56666dc-c099-4778-ad82-9ad4f209567b.png&w=1280&q=85" alt="Icon" className="w-10 h-10 sm:w-12 sm:h-12 rounded-lg mb-8 object-cover opacity-90" />
                                <div className="flex items-baseline gap-3 mb-6">
                                    <h3 className="text-[#E1E0CC] font-medium tracking-tight text-base sm:text-lg">Private Network.</h3>
                                    <span className="text-gray-500 text-xs font-serif italic">03</span>
                                </div>
                                <ul className="space-y-4 flex-1">
                                    {["Curated member access", "High-trust relationships", "Invite-only gatherings", "Long-term collaboration"].map((item, i) => (
                                        <li key={i} className="flex items-start gap-3 text-[11px] sm:text-xs text-gray-400 font-light leading-relaxed">

            const [open, setOpen] = useState(false);

            useEffect(() => {
                const openForm = () => setOpen(true);
                window.addEventListener('open-founder-application', openForm);
                return () => window.removeEventListener('open-founder-application', openForm);
            }, []);

            useEffect(() => {
                document.body.style.overflow = open ? 'hidden' : '';
                return () => { document.body.style.overflow = ''; };

            if (!open) return null;

            return (
                <div className="form-overlay fixed inset-0 z-[100] bg-black/80 backdrop-blur-md flex items-center justify-center p-4 md:p-6">

                        initial={{ opacity: 0, y: 18, scale: 0.98 }}
                        animate={{ opacity: 1, y: 0, scale: 1 }}
                        transition={{ duration: 0.35, ease: [0.16, 1, 0.3, 1] }}
